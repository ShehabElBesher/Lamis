<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى شبح التيك توك (لميس) 👻💕</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fce4ec; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none; 
            -webkit-user-select: none;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            position: relative;
            z-index: 10;
        }

        .cat-gif {
            width: 250px;
            height: 250px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 10px;
            transition: opacity 0.3s ease;
        }

        h2 {
            color: #d81b60;
            font-size: 24px;
            line-height: 1.6;
            margin-bottom: 30px;
            min-height: 80px;
        }

        .next-btn {
            background-color: #d81b60;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.3);
        }

        .next-btn:hover {
            background-color: #ad1457;
            transform: scale(1.05);
        }

        .final-buttons {
            display: none;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .yes-btn {
            background-color: #d81b60;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.3);
            transition: transform 0.2s;
        }

        .yes-btn:hover {
            transform: scale(1.1);
            background-color: #ad1457;
        }

        .no-btn {
            background-color: #f1f1f1;
            color: #333;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصورة المبدئية -->
        <img id="story-gif" src="https://tenor.com/view/peach-and-goma-peach-and-goma-heart-peach-and-goma-love-gif-17536767128240462356.gif" alt="Cute Cat" class="cat-gif">
        
        <h2 id="story-text">أول مرة في حياتي أخد بالي من حد وأهتم بيه كده... يا لميس انتي حد مميز جداً، جميلة، رقيقة، وعاقلة بزيادة 💖</h2>
        
        <button id="next-button" class="next-btn" onclick="nextScene()">بجد؟ 🙈</button>

        <div id="final-buttons" class="final-buttons">
            <button class="yes-btn" onclick="sayYes()">موافقة طبعاً! 🥰</button>
            <button id="no-btn" class="no-btn" onmouseover="runAway(event)" ontouchstart="runAway(event)">لا 😾</button>
        </div>
    </div>

    <script>
        const scenes = [
            {
                text: "أول مرة في حياتي أخد بالي من حد وأهتم بيه كده... يا لميس انتي حد مميز جداً، جميلة، رقيقة، وعاقلة بزيادة 💖",
                gif: "https://tenor.com/view/peach-and-goma-peach-and-goma-heart-peach-and-goma-love-gif-17536767128240462356.gif", 
                btn: "بجد؟ 🙈"
            },
            {
                // تم تعديل الصورة هنا
                text: "وغير الرقة دي، انتي حرفياً (شبح التيك توك)! 👻 ولما بتقولي 'اررررححححب' بتعملي عظمة يا لميس! 😂",
                gif: "https://tenor.com/view/peach-goma-peach-and-goma-heart-love-gif-21391528.gif", 
                btn: "ههههه كمل ✨"
            },
            {
                text: "وده احساسي لما (ربنا ما يخسرك أبداً في حاجة) بنخسر وتقولي اخدووو ونااااتي 🥺💔",
                gif: "https://tenor.com/view/mochi-cat-crying-gif-13367115646853754077.gif", 
                btn: "يا روحي 🥺"
            },
            {
                text: "ودي وانتي مستنية تكسبي الجولة 🥺",
                gif: "https://tenor.com/view/j%26d-kitty-gif-10368791297347099509.gif", 
                btn: "التالي 👀"
            },
            {
                text: "ودي وانتي بتقولي ربنا أكيد هيكرم.. وصغنن مستني 🥰",
                gif: "https://tenor.com/view/peach-and-goma-gif-2983905865950500979.gif", 
                btn: "يا خلاصي 🥰"
            },
            {
                text: "دي بقى لما تقولي تكبيس ونبقى 2 بس في اللايف... بس أداءك كأن فيه ألف واحد بيكبس ههههه 😂",
                gif: "https://tenor.com/view/peach-goma-mitao-cat-dance-gif-12799903058830604934.gif", 
                btn: "ههههههه"
            },
            {
                text: "ودي وانتي متحمسة 🤩",
                gif: "https://tenor.com/view/movietime-gif-26874766.gif", 
                btn: "التالي 👀"
            },
            {
                text: "فالقط مقدرش يستحمل، راح قعد على الكمبيوتر وكتب كود الصفحة دي مخصوص عشان يبعتهولك يا لميس 💻🐈",
                gif: "https://tenor.com/view/peach-and-goma-gif-14755089461093313163.gif", 
                btn: "ايه هي الرسالة؟ 💌"
            },
            {
                text: "بما إني عملت الكود ده مخصوص ليكي... هل تقبلي نشرب قهوة سوا ونعوض أي win ضاع منك يا لميس؟ ☕💕",
                gif: "https://tenor.com/view/bubu-dudu-coffee-break-pilui-gif-15095084592566815021.gif", 
                isFinal: true
            }
        ];

        let currentScene = 0;

        function nextScene() {
            currentScene++;
            
            if(currentScene < scenes.length) {
                document.getElementById("story-gif").src = scenes[currentScene].gif;
                document.getElementById("story-text").innerText = scenes[currentScene].text;
                
                if(scenes[currentScene].isFinal) {
                    document.getElementById("next-button").style.display = "none";
                    document.getElementById("final-buttons").style.display = "flex";
                } else {
                    document.getElementById("next-button").innerText = scenes[currentScene].btn;
                }
            }
        }

        function runAway(event) {
            if(event) {
                event.preventDefault();
            }
            
            const button = document.getElementById("no-btn");
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const btnWidth = button.offsetWidth || 100;
            const btnHeight = button.offsetHeight || 50;
            
            button.style.position = "fixed";
            
            const randomX = Math.random() * (windowWidth - btnWidth - 20) + 10;
            const randomY = Math.random() * (windowHeight - btnHeight - 20) + 10;
            
            button.style.left = randomX + "px";
            button.style.top = randomY + "px";
        }

        function sayYes() {
            document.getElementById("story-gif").src = "https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif";
            document.getElementById("story-text").innerText = "أحلى موافقة في الدنيا💖 هستناكي نحدد الميعاد يا مسكره هانم 🥰🎉";
            document.getElementById("final-buttons").style.display = "none";
            createHearts();
        }

        function createHearts() {
            for (let i = 0; i < 40; i++) {
                let heart = document.createElement("div");
                heart.innerHTML = "💖";
                heart.style.position = "fixed";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.top = "-5vh";
                heart.style.fontSize = (Math.random() * 20 + 10) + "px";
                heart.style.animation = `fall ${Math.random() * 3 + 2}s linear`;
                heart.style.zIndex = "100";
                document.body.appendChild(heart);
                
                let style = document.createElement('style');
                style.innerHTML = `
                    @keyframes fall {
                        to { transform: translateY(105vh) rotate(360deg); }
                    }
                `;
                document.head.appendChild(style);
            }
        }
    </script>
</body>
</html>
