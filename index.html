<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى شبح التيك توك 👻💕</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fce4ec; /* وردي هادي جداً */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
            position: relative;
            z-index: 10;
        }

        .cat-gif {
            width: 250px;
            height: 250px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 10px;
            transition: opacity 0.3s ease;
        }

        h2 {
            color: #d81b60;
            font-size: 24px;
            line-height: 1.5;
            margin-bottom: 30px;
            min-height: 80px;
        }

        .next-btn {
            background-color: #d81b60;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.3);
        }

        .next-btn:hover {
            background-color: #ad1457;
            transform: scale(1.05);
        }

        /* تنسيق أزرار النهاية */
        .final-buttons {
            display: none;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .yes-btn {
            background-color: #d81b60;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.3);
            transition: transform 0.2s;
        }

        .yes-btn:hover {
            transform: scale(1.1);
            background-color: #ad1457;
        }

        .no-btn {
            background-color: #f1f1f1;
            color: #333;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصورة -->
        <img id="story-gif" src="https://media.tenor.com/X2A6fOq8xOMAAAAi/cat-phone.gif" alt="Cute Cat" class="cat-gif">
        
        <!-- النص -->
        <h2 id="story-text">بتفرج على التيك توك كالعادة... فجأة ظهرتلي تيك توكر جديدة اسمها (لميس) ✨</h2>
        
        <!-- زر التالي -->
        <button id="next-button" class="next-btn" onclick="nextScene()">وبعدين؟ 👀</button>

        <!-- أزرار المشهد الأخير -->
        <div id="final-buttons" class="final-buttons">
            <button class="yes-btn" onclick="sayYes()">موافقة طبعاً! 🥰</button>
            <button id="no-btn" class="no-btn" onmouseover="runAway()">لا 😾</button>
        </div>
    </div>

    <script>
        // أحداث القصة
        const scenes = [
            {
                text: "بتفرج على التيك توك كالعادة... فجأة ظهرتلي تيك توكر جديدة اسمها (لميس) ✨",
                gif: "https://media.tenor.com/X2A6fOq8xOMAAAAi/cat-phone.gif", // قط ماسك موبايل
                btn: "وبعدين؟ 👀"
            },
            {
                text: "أول مرة في حياتي أخد بالي من حد وأهتم بيه كده... انتي حد مميز جداً، جميلة، رقيقة، وعاقلة بزيادة 💖",
                gif: "https://media.tenor.com/ZtwD1rEheQ4AAAAi/peach-goma.gif", // قط عيونه قلوب
                btn: "بجد؟ 🙈"
            },
            {
                text: "وغير الرقة دي، انتي حرفياً (شبح التيك توك)! 👻 ولما بتقولي 'اررررححححب' بتعملي عظمة! 😂",
                gif: "https://media.tenor.com/kYqU37-f0ZgAAAAi/bubu-bubu-dudu.gif", // قط متحمس ومبسوط
                btn: "ههههه كمل ✨"
            },
            {
                text: "بس أكتر حاجة بتخطف قلبي... لما بتخسري الـ win وتقولي 'وناااااتيييي' بطريقتك القمر دي 🥺💔",
                gif: "https://media.tenor.com/bY-qT3z3wTEAAAAi/bubu-dudu.gif", // قط زعلان ولطيف
                btn: "يا روحي 🥺"
            },
            {
                text: "فالقط مقدرش يستحمل، راح قعد على الكمبيوتر وسهر يكتب كود الصفحة دي مخصوص عشان يبعتهالك 💻🐈",
                gif: "https://media.tenor.com/0P6V70vS2pUAAAAi/cat-typing.gif", // قط بيكتب على الكيبورد بسرعة
                btn: "ايه هي الرسالة؟ 💌"
            },
            {
                text: "بما إني عملت الكود ده مخصوص... هل تقبلي نشرب قهوة سوا ونعوض أي win ضاع منك؟ ☕💕",
                gif: "https://media.tenor.com/efebwZXGQCUAAAAi/tkthao219-peach.gif", // قط بيقدم وردة
                isFinal: true
            }
        ];

        let currentScene = 0;

        function nextScene() {
            currentScene++;
            
            if(currentScene < scenes.length) {
                // تغيير الصورة والنص والزر
                document.getElementById("story-gif").src = scenes[currentScene].gif;
                document.getElementById("story-text").innerText = scenes[currentScene].text;
                
                if(scenes[currentScene].isFinal) {
                    // إخفاء زر التالي وإظهار أزرار نعم ولا
                    document.getElementById("next-button").style.display = "none";
                    document.getElementById("final-buttons").style.display = "flex";
                } else {
                    document.getElementById("next-button").innerText = scenes[currentScene].btn;
                }
            }
        }

        // دالة هروب زر "لا"
        function runAway() {
            const button = document.getElementById("no-btn");
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            button.style.position = "fixed";
            
            const randomX = Math.random() * (windowWidth - 100);
            const randomY = Math.random() * (windowHeight - 50);
            
            button.style.left = randomX + "px";
            button.style.top = randomY + "px";
        }

        // دالة الموافقة
        function sayYes() {
            document.getElementById("story-gif").src = "https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif";
            document.getElementById("story-text").innerText = "أحلى موافقة في الدنيا! هستناكي نحدد الميعاد 🥰🎉";
            document.getElementById("final-buttons").style.display = "none";
            createHearts();
        }

        // مطر القلوب
        function createHearts() {
            for (let i = 0; i < 40; i++) {
                let heart = document.createElement("div");
                heart.innerHTML = "💖";
                heart.style.position = "fixed";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.top = "-5vh";
                heart.style.fontSize = (Math.random() * 20 + 10) + "px";
                heart.style.animation = `fall ${Math.random() * 3 + 2}s linear`;
                heart.style.zIndex = "100";
                document.body.appendChild(heart);
                
                let style = document.createElement('style');
                style.innerHTML = `
                    @keyframes fall {
                        to { transform: translateY(105vh) rotate(360deg); }
                    }
                `;
                document.head.appendChild(style);
            }
        }
    </script>
</body>
</html>
